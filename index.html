<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本旅遊專屬購物清單</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --primary-color: #5b799e;
            --primary-hover: #486385;
            --accent-color: #8da4c4;
            --text-color: #2c3e50;
            --border-color: #d1dede;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(91, 121, 158, 0.12);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .input-section {
            background: #eaf1f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-section input, .input-section button {
            width: 100%;
            box-sizing: border-box;
        }

        .input-section input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            outline: none;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .btn-danger {
            background-color: #e57373;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #eef2f5;
            vertical-align: middle;
        }

        th {
            background-color: #f0f4f8;
            color: var(--primary-color);
            font-weight: 600;
        }

        .checked-row {
            background-color: #f7fafc;
            color: #95a5a6;
        }

        .item-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .editable-input {
            width: 70px;
            padding: 6px;
            text-align: right;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
        }

        .rate-input {
            width: 70px;
            padding: 4px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .summary-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .summary-box {
            background: #f0f4f8;
            padding: 14px 16px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-color);
        }

        .summary-box h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            color: var(--primary-color);
        }

        .summary-box .amount {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
        }

        .rate-settings {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eaf1f7;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>啾啾啾啾啾蒂日本購物清單🎀</h2>
    <div class="subtitle">手機版專用：隨時新增、勾選與計算金額！</div>
    
    <div class="rate-settings">
        <div><strong>📌 匯率設定：</strong></div>
        <div>
            <input type="number" id="globalRate" class="rate-input" value="0.22" step="0.001" oninput="renderTable()">
        </div>
    </div>

    <div class="input-section">
        <input type="text" id="itemName" placeholder="物品名稱 (例：大耳狗吊飾)">
        <input type="number" id="itemPrice" placeholder="預估日幣 (¥)">
        <input type="file" id="itemImage" accept="image/*">
        <input type="text" id="itemLocation" placeholder="購買地點/備註">
        <button class="btn" onclick="addItem()">加入清單</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 35px;">買</th>
                <th style="width: 45px;">圖</th>
                <th>名稱</th>
                <th>日幣 (¥)</th>
                <th>台幣 (NT$)</th>
                <th style="width: 45px;">刪</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="summary-panel">
        <div class="summary-box">
            <h3>📋 總預估金額</h3>
            <div class="amount">日幣 <span id="estJpy">¥0</span> / 台幣 <span id="estTwd">NT$0</span></div>
        </div>
        <div class="summary-box" style="border-left-color: #689f38;">
            <h3>🛒 實際已買總花費</h3>
            <div class="amount" style="color: #2e7d32;">日幣 <span id="actualJpy">¥0</span> / 台幣 <span id="actualTwd">NT$0</span></div>
        </div>
    </div>
</div>

<script>
    let shoppingList = [];
    try {
        let saved = localStorage.getItem('foggy_blue_shop_v5');
        if (saved) shoppingList = JSON.parse(saved);
    } catch (e) {}

    window.onload = function() { renderTable(); };

    function addItem() {
        let name = document.getElementById('itemName').value.trim();
        let price = parseFloat(document.getElementById('itemPrice').value) || 0;
        let location = document.getElementById('itemLocation').value.trim();
        let imageInput = document.getElementById('itemImage');

        if (!name) { alert("請填寫物品名稱！"); return; }

        if (imageInput.files && imageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) { saveItem(name, price, location, e.target.result); };
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            saveItem(name, price, location, "");
        }
    }

    function saveItem(name, price, location, imageSrc) {
        shoppingList.push({ name, price, location, image: imageSrc, checked: false });
        localStorage.setItem('foggy_blue_shop_v5', JSON.stringify(shoppingList));
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemLocation').value = '';
        document.getElementById('itemImage').value = '';
        renderTable();
    }

    function toggleCheck(index) {
        shoppingList[index].checked = !shoppingList[index].checked;
        localStorage.setItem('foggy_blue_shop_v5', JSON.stringify(shoppingList));
        renderTable();
    }

    function updatePrice(index, value) {
        let val = parseFloat(value);
        shoppingList[index].price = isNaN(val) ? 0 : val;
        localStorage.setItem('foggy_blue_shop_v5', JSON.stringify(shoppingList));
        renderTable();
    }

    function deleteItem(index) {
        shoppingList.splice(index, 1);
        localStorage.setItem('foggy_blue_shop_v5', JSON.stringify(shoppingList));
        renderTable();
    }

    function renderTable() {
        let tbody = document.getElementById('tableBody');
        let rate = parseFloat(document.getElementById('globalRate').value) || 0.22;
        tbody.innerHTML = '';
        let estJpy = 0, estTwd = 0, actualJpy = 0, actualTwd = 0;

        shoppingList.forEach((item, index) => {
            let itemTwd = Math.round(item.price * rate);
            estJpy += item.price;
            estTwd += itemTwd;
            if (item.checked) { actualJpy += item.price; actualTwd += itemTwd; }

            let row = document.createElement('tr');
            if (item.checked) row.classList.add('checked-row');

            row.innerHTML = `
                <td><input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})" style="width:16px; height:16px;"></td>
                <td>${item.image ? `<img src="${item.image}" class="item-img">` : '<span style="font-size:10px; color:#aaa;">無</span>'}</td>
                <td style="text-align: left; ${item.checked ? 'text-decoration: line-through; color: #95a5a6;' : ''}">${item.name}<br><span style="font-size:11px; color:#888;">${item.location || ''}</span></td>
                <td><input type="number" class="editable-input" value="${item.price}" oninput="updatePrice(${index}, this.value)"></td>
                <td style="font-weight: bold;">${itemTwd.toLocaleString()}</td>
                <td><button class="btn-danger" onclick="deleteItem(${index})">刪</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('estJpy').innerText = "¥ " + estJpy.toLocaleString();
        document.getElementById('estTwd').innerText = "NT$ " + estTwd.toLocaleString();
        document.getElementById('actualJpy').innerText = "¥ " + actualJpy.toLocaleString();
        document.getElementById('actualTwd').innerText = "NT$ " + actualTwd.toLocaleString();
    }
</script>
</body>
</html>
